services:
  - type: web
    name: tmc-choir-backend
    runtime: node
    rootDir: server-tmc-choir-system
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set manually in Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BACKEND_PORT
        value: 3302
      - key: FRONTEND_URL
        sync: false   # Set to your Vercel URL after deploying frontend
