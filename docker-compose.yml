services:
  postgres:
    image: postgres:16
    container_name: tmc-choir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_ROOT_USER}
      POSTGRES_PASSWORD: ${DATABASE_ROOT_PASS}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tmc-choir-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_ROOT_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./server-tmc-choir-system
      dockerfile: Dockerfile
      network: host
    container_name: tmc-choir-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DATABASE_ROOT_USER}:${DATABASE_ROOT_PASS}@postgres:5432/${DATABASE_NAME}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_ROOT_USER}
      DATABASE_PASSWORD: ${DATABASE_ROOT_PASS}
      DATABASE_NAME: ${DATABASE_NAME}
      BACKEND_PORT: ${BACKEND_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      # Socket.IO CORS — allow the browser-facing frontend origin
      FRONTEND_URL: http://localhost:${FRONTEND_PORT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./server-tmc-choir-system:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tmc-choir-net

  frontend:
    build:
      context: ./client-tmc-choir-system
      dockerfile: Dockerfile
      network: host
    container_name: tmc-choir-frontend
    restart: unless-stopped
    environment:
      # Used by Vite dev-server proxy for both /api and /socket.io
      VITE_API_TARGET: http://backend:${BACKEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./client-tmc-choir-system:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - tmc-choir-net

networks:
  tmc-choir-net:
    driver: bridge

volumes:
  postgres_data:
