services:
  mysql:
    image: mysql:8.0
    container_name: tmc-choir-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASS}
      MYSQL_DATABASE: ${DATABASE_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tmc-choir-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppasscode"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./server-tmc-choir-system
      dockerfile: Dockerfile
      network: host
    container_name: tmc-choir-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DATABASE_ROOT_USER}:${DATABASE_ROOT_PASS}@mysql:3306/${DATABASE_NAME}
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: ${DATABASE_ROOT_USER}
      DATABASE_PASSWORD: ${DATABASE_ROOT_PASS}
      DATABASE_NAME: ${DATABASE_NAME}
      BACKEND_PORT: ${BACKEND_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./server-tmc-choir-system:/app
      - /app/node_modules
      - /app/generated
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tmc-choir-net

  frontend:
    build:
      context: ./client-tmc-choir-system
      dockerfile: Dockerfile
      network: host
    container_name: tmc-choir-frontend
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://backend:${BACKEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./client-tmc-choir-system:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - tmc-choir-net

networks:
  tmc-choir-net:
    driver: bridge

volumes:
  mysql_data:
