services:
  mysql:
    image: mysql:8.0
    container_name: tmc-choir-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: passcode
      MYSQL_DATABASE: tmc_choir_system_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tmc-choir-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppasscode"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./server-tmc-choir-system
      dockerfile: Dockerfile
    container_name: tmc-choir-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://root:passcode@mysql:3306/tmc_choir_system_db
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: passcode
      DATABASE_NAME: tmc_choir_system_db
      BACKEND_PORT: 3002
      JWT_SECRET: supersecretkey
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3002:3002"
    volumes:
      - ./server-tmc-choir-system:/app
      - /app/node_modules
      - /app/generated
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tmc-choir-net

  frontend:
    build:
      context: ./client-tmc-choir-system
      dockerfile: Dockerfile
    container_name: tmc-choir-frontend
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://backend:3002
    ports:
      - "5173:5173"
    volumes:
      - ./client-tmc-choir-system:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - tmc-choir-net

networks:
  tmc-choir-net:
    driver: bridge

volumes:
  mysql_data:
